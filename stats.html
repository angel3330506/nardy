<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Нарды — статистика</title>
<style>
:root{color-scheme:dark;--bg:#120e0a;--card:#1d1610;--line:rgba(217,181,106,.18);--fg:#efe6d4;--muted:#a8987c;--gold:#e8c878;--a:#e8c878;--b:#7fb0e0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:Georgia,serif;font-weight:400;color:var(--gold);font-size:30px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:2px 0 20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tile b{display:block;font-size:30px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;line-height:1.15}
.tile span{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{margin:0 0 4px;font-size:15px;font-weight:600}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg{display:block;width:100%;height:auto}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:150px 1fr 48px;gap:10px;align-items:center;font-size:14px}
.bar{height:10px;border-radius:5px;background:rgba(255,255,255,.06);overflow:hidden}.bar div{height:100%;background:var(--a);border-radius:5px}
.row em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.two{grid-template-columns:1fr}.row{grid-template-columns:110px 1fr 40px}}
.err{color:#e58b7a}
</style></head>
<body><main>
<h1>Статистика «Нард»</h1>
<div class="sub" id="sub">Загружаем…</div>
<div class="tiles" id="tiles"></div>
<div class="card"><h2>Игроки по дням — последние 30 дней</h2>
  <div class="legend"><span><i style="background:var(--a)"></i>играли в этот день</span><span><i style="background:var(--b)"></i>новые</span></div>
  <div id="chart"></div></div>
<div class="two">
  <div class="card"><h2>Партии по режимам — всего</h2><div class="rows" id="modes"></div></div>
  <div class="card"><h2>Устройства</h2><div class="rows" id="devs"></div></div>
</div>
</main>
<script type="module">
const CFG={apiKey:'AIzaSyCth8f_piW1AWTqA6cmXXRfFO6nN2nnUHk',authDomain:'nardy-c0996.firebaseapp.com',
  databaseURL:'https://nardy-c0996-default-rtdb.europe-west1.firebasedatabase.app',projectId:'nardy-c0996',appId:'1:35601586775:web:19f96c4e493a8d609fe112'};
const V='10.12.2', g=m=>import(`https://www.gstatic.com/firebasejs/${V}/firebase-${m}.js`);
const $=id=>document.getElementById(id);
const day=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
try{
  const [A,Au,D]=await Promise.all([g('app'),g('auth'),g('database')]);
  const app=A.initializeApp(CFG); await Au.signInAnonymously(Au.getAuth(app));
  const st=(await D.get(D.ref(D.getDatabase(app),'stats'))).val()||{};
  const U=st.u||{}, Dd=st.d||{}, Gg=st.g||{}, now=Date.now(), T=day(now);
  const users=Object.values(U), firsts=users.map(u=>u.f).filter(Boolean);
  const newIn=ms=>firsts.filter(f=>now-f<ms).length, DAYMS=864e5;
  const dau=k=>Object.keys(Dd[k]||{}).length;
  const activeIn=n=>{ const s=new Set(); for(let i=0;i<n;i++){ Object.keys(Dd[day(now-i*DAYMS)]||{}).forEach(x=>s.add(x)); } return s.size; };
  const games=k=>Object.keys(Gg[k]||{}).length, gamesAll=Object.values(Gg).reduce((s,o)=>s+Object.keys(o).length,0);
  const tiles=[[users.length,'всего игроков'],[firsts.filter(f=>day(f)===T).length,'новых сегодня'],[newIn(7*DAYMS),'новых за 7 дней'],
    [dau(T),'играли сегодня'],[activeIn(7),'играли за 7 дней'],[games(T),'партий сегодня'],[gamesAll,'партий всего'],
    [users.filter(u=>u.a).length,'поставили на экран «Домой»']];
  $('tiles').innerHTML=tiles.map(([n,t])=>`<div class="tile"><b>${n}</b><span>${t}</span></div>`).join('');
  // график: 30 дней
  const days=[...Array(30)].map((_,i)=>day(now-(29-i)*DAYMS));
  const nNew=k=>firsts.filter(f=>day(f)===k).length;
  const vals=days.map(k=>[dau(k),nNew(k)]), mx=Math.max(1,...vals.flat());
  const W=900,H=220,pl=30,pb=24,bw=(W-pl)/30;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Игроки по дням">`;
  for(let i=0;i<=4;i++){ const y=H-pb-(H-pb-10)*i/4, v=Math.round(mx*i/4); s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${pl-6}" y="${y+4}" fill="#a8987c" font-size="11" text-anchor="end">${v}</text>`; }
  vals.forEach(([a,b],i)=>{ const x=pl+i*bw, ha=(H-pb-10)*a/mx, hb=(H-pb-10)*b/mx;
    s+=`<rect x="${x+bw*.12}" y="${H-pb-ha}" width="${bw*.38}" height="${ha}" rx="3" fill="#e8c878"><title>${days[i]}: играли ${a}</title></rect>`;
    s+=`<rect x="${x+bw*.52}" y="${H-pb-hb}" width="${bw*.38}" height="${hb}" rx="3" fill="#7fb0e0"><title>${days[i]}: новых ${b}</title></rect>`;
    if(i%5===4||i===29) s+=`<text x="${x+bw/2}" y="${H-6}" fill="#a8987c" font-size="11" text-anchor="middle">${days[i].slice(8)}.${days[i].slice(5,7)}</text>`; });
  $('chart').innerHTML=s+'</svg>';
  const rows=(el,pairs)=>{ const m=Math.max(1,...pairs.map(p=>p[1])); $(el).innerHTML=pairs.map(([t,n])=>`<div class="row"><span>${t}</span><div class="bar"><div style="width:${n/m*100}%"></div></div><em>${n}</em></div>`).join('')||'<span class="sub">пока пусто</span>'; };
  const M={ai:'С соперником',tour:'Турнир двора',pvp:'Вдвоём',net:'По сети'}, mc={};
  Object.values(Gg).forEach(o=>Object.values(o).forEach(r=>{ mc[r.m]=(mc[r.m]||0)+1; }));
  rows('modes',Object.entries(mc).sort((a,b)=>b[1]-a[1]).map(([k,n])=>[M[k]||k,n]));
  const P={ios:'iPhone / iPad',android:'Android',pc:'Компьютер'}, pc={};
  users.forEach(u=>{ pc[u.p]=(pc[u.p]||0)+1; });
  rows('devs',Object.entries(pc).sort((a,b)=>b[1]-a[1]).map(([k,n])=>[P[k]||k,n]));
  $('sub').textContent='Обновлено '+new Date().toLocaleString('ru-RU')+' · считаются устройства с версии игры от 5 ноября 2026';
}catch(e){ $('sub').innerHTML='<span class="err">Не удалось загрузить: '+(e.message||e)+'</span> — проверьте, что опубликованы новые правила базы.'; }
</script>
</body></html>
