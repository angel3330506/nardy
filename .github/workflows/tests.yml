name: Тесты правил
on:
  push:
    paths: ['index.html', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['index.html', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/*.test.js
